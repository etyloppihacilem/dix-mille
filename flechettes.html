<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dix-mille">
  <title>Fléchettes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <a class="icon-btn back" href="./" aria-label="Accueil">‹</a>
      <h1>Fléchettes</h1>
    </div>
    <div class="topbar-actions">
      <button id="fsBtn" class="icon-btn" type="button" title="Plein écran" aria-label="Plein écran">⛶</button>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="Son">♪</button>
      <button id="wakeBtn" class="icon-btn" type="button" title="Garder l'écran allumé" aria-label="Garder l'écran allumé">☀</button>
      <button id="editBtn" class="pill-btn" type="button">Joueurs</button>
    </div>
  </header>

  <main id="players" class="players" aria-label="Joueurs"></main>

  <section id="playPanel" class="panel">
    <div class="entry">
      <span id="entryDot" class="dot"></span>
      <div class="entry-text">
        <div id="entryName" class="entry-name"></div>
        <div id="entryCalc" class="entry-calc"></div>
      </div>
      <button id="endStatsBtn" class="mode-btn on" type="button" hidden>📊 Stats</button>
      <button id="redoBtn" class="mode-btn" type="button" hidden>↷ Rétablir</button>
      <button id="modeBtn" class="mode-btn" type="button">Corriger</button>
    </div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button data-k="back" class="fn" aria-label="Effacer">⌫</button>
      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button data-k="undo" class="fn" aria-label="Annuler">↶</button>
      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button data-k="0">0</button>
      <button data-k="ok" class="ok span4">Valider la volée</button>
    </div>
  </section>

  <section id="editPanel" class="panel edit-panel" hidden>
    <div class="target-row">
      <span>Départ à</span>
      <div id="targetChoices" class="chips"></div>
    </div>
    <div id="rosterPicker" class="chips roster-picker"></div>
    <button id="statsBtn" class="wide-btn" type="button">📊 Statistiques de la partie</button>
    <button id="newGameBtn" class="wide-btn danger" type="button">Nouvelle partie</button>
    <button id="doneBtn" class="wide-btn primary" type="button">Jouer</button>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>window.GAME = { game: 'flechettes', storageKey: 'flechettes-state-v1', target: 501, targetChoices: [301, 501, 701], countdown: true, defaultName: 'Joueur', maxDigits: 3 };</script>
  <script src="common.js"></script>
  <script src="roster.js"></script>
  <script src="stats.js"></script>
  <script src="counter.js"></script>
</body>
</html>
