<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b5e3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dix-mille">
  <title>Yams</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <a class="icon-btn back" href="./" aria-label="Accueil">‹</a>
      <h1>Yams</h1>
    </div>
    <div class="topbar-actions">
      <button id="fsBtn" class="icon-btn" type="button" title="Plein écran" aria-label="Plein écran">⛶</button>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="Son">♪</button>
      <button id="wakeBtn" class="icon-btn" type="button" title="Garder l'écran allumé" aria-label="Garder l'écran allumé">☀</button>
      <button id="editBtn" class="pill-btn" type="button">Joueurs</button>
    </div>
  </header>

  <main id="grid" class="grid-wrap" aria-label="Feuille de score"></main>
  <main id="players" class="players" aria-label="Joueurs" hidden></main>

  <section id="playPanel" class="panel">
    <div class="entry">
      <span id="entryDot" class="dot"></span>
      <div class="entry-text">
        <div id="entryName" class="entry-name"></div>
        <div id="entryCalc" class="entry-calc"></div>
      </div>
      <button id="redoBtn" class="mode-btn" type="button" hidden>↷ Rétablir</button>
    </div>
    <div id="quick" class="chips quick"></div>
    <div class="keypad compact" id="keypad">
      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button data-k="back" class="fn" aria-label="Effacer">⌫</button>
      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button data-k="cross" class="fn cross" aria-label="Barrer">✗</button>
      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button data-k="undo" class="fn" aria-label="Annuler">↶</button>
      <button data-k="0" class="span2">0</button>
      <button data-k="ok" class="ok">Valider</button>
    </div>
  </section>

  <section id="editPanel" class="panel edit-panel" hidden>
    <button id="addPlayerBtn" class="wide-btn" type="button">+ Ajouter un joueur</button>
    <button id="newGameBtn" class="wide-btn danger" type="button">Nouvelle partie (feuilles vides)</button>
    <button id="doneBtn" class="wide-btn primary" type="button">Jouer</button>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="common.js"></script>
  <script src="yams.js"></script>
</body>
</html>
