<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background: Android crops it to a circle or squircle.
       The die stays inside the central safe zone (radius 40%). -->
  <rect width="512" height="512" fill="#1b5e3b"/>
  <g transform="translate(256 256) scale(.78) rotate(-12) translate(-256 -256)">
    <rect x="116" y="116" width="280" height="280" rx="56" fill="#fdfbf5"/>
    <g fill="#c62828">
      <circle cx="186" cy="186" r="30"/><circle cx="326" cy="186" r="30"/>
      <circle cx="256" cy="256" r="30"/>
      <circle cx="186" cy="326" r="30"/><circle cx="326" cy="326" r="30"/>
    </g>
  </g>
</svg>
