<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dix-mille">
  <title>Scoppa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <a class="icon-btn back" href="./" aria-label="Accueil">‹</a>
      <h1>Scoppa</h1>
    </div>
    <div class="topbar-actions">
      <button id="fsBtn" class="icon-btn" type="button" title="Plein écran" aria-label="Plein écran">⛶</button>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="Son">♪</button>
      <button id="wakeBtn" class="icon-btn" type="button" title="Garder l'écran allumé" aria-label="Garder l'écran allumé">☀</button>
      <button id="editBtn" class="pill-btn" type="button">Équipes</button>
    </div>
  </header>

  <div id="board" class="board"></div>
  <main id="sheet" class="sheet-wrap" aria-label="Manche en cours"></main>
  <main id="players" class="players" aria-label="Équipes" hidden></main>

  <section id="playPanel" class="panel round-actions">
    <button id="undoBtn" class="mode-btn" type="button" aria-label="Annuler">↶</button>
    <button id="redoBtn" class="mode-btn" type="button" aria-label="Rétablir" hidden>↷</button>
    <button id="validateBtn" class="wide-btn primary" type="button">Valider la manche</button>
  </section>

  <section id="editPanel" class="panel edit-panel" hidden>
    <div class="target-row">
      <span>Partie en</span>
      <div id="targetChoices" class="chips"></div>
      <span>points</span>
    </div>
    <button id="addPlayerBtn" class="wide-btn" type="button">+ Ajouter une équipe</button>
    <button id="statsBtn" class="wide-btn" type="button">📊 Statistiques de la partie</button>
    <button id="newGameBtn" class="wide-btn danger" type="button">Nouvelle partie (effacer les manches)</button>
    <button id="doneBtn" class="wide-btn primary" type="button">Jouer</button>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="common.js"></script>
  <script src="stats.js"></script>
  <script src="scoppa.js"></script>
</body>
</html>
